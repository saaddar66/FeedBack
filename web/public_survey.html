<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedy - Public Access</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body class="bg-gray-100 min-h-screen flex flex-col items-center py-8 px-4">

  <div class="w-full max-w-xl bg-white rounded-xl shadow-lg overflow-hidden">

    <!-- Header / Navigation -->
    <header class="bg-indigo-600 p-4 text-white flex justify-between items-center">
      <h1 class="font-bold text-lg">Feedy Public</h1>
      <nav class="space-x-4 text-sm font-medium">
        <button id="navSurveyBtn" class="hover:text-indigo-200 underline">Survey</button>
        <button id="navMenuBtn" class="hover:text-indigo-200 opacity-70">Order Food</button>
      </nav>
    </header>

    <div class="p-6 relative min-h-[400px]">

      <!-- ================= LOADING SECTION ================= -->
      <section id="loadingSection"
        class="text-center absolute inset-0 flex flex-col justify-center items-center bg-white z-50">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto"></div>
        <p class="mt-4 text-gray-600">Loading...</p>
      </section>

      <!-- ================= ERROR SECTION ================= -->
      <section id="errorSection" class="hidden text-center py-8">
        <div class="bg-red-50 border border-red-200 rounded-lg p-4 inline-block">
          <p class="text-red-800 font-medium" id="errorMessage">Something went wrong.</p>
        </div>
        <button id="retryBtn" class="block mx-auto mt-4 text-indigo-600 underline">Retry</button>
      </section>

      <!-- ================= SURVEY FLOW ================= -->
      <div id="surveyContainer">

        <!-- Survey Questions -->
        <section id="surveySection" class="hidden">
          <h2 class="text-2xl font-bold mb-4 text-gray-800" id="surveyTitle">Survey</h2>
          <form id="surveyForm" class="space-y-6">
            <div id="questionsContainer"></div>
            <button type="submit" id="submitSurveyBtn"
              class="w-full bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 font-bold transition">
              Submit Survey
            </button>
          </form>
        </section>

        <!-- Feedback Form (After Survey or Standalone) -->
        <section id="feedbackSection" class="hidden">
          <h2 class="text-2xl font-bold mb-4 text-gray-800">Feedback</h2>
          <form id="feedbackForm" class="space-y-4">
            <div>
              <label class="block font-medium mb-1">Name (optional)</label>
              <input type="text" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-indigo-500" name="name"
                id="feedbackName" />
            </div>
            <div>
              <label class="block font-medium mb-1">Email (optional)</label>
              <input type="email" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-indigo-500" name="email"
                id="feedbackEmail" />
            </div>
            <div>
              <label class="block font-medium mb-1">Rating <span class="text-red-500">*</span></label>
              <div class="flex gap-2 justify-center py-2" id="starRatingContainer">
                <!-- Stars rendered by JS -->
              </div>
              <input type="hidden" name="rating" id="feedbackRating" required />
              <div class="text-center text-sm font-medium text-indigo-600 h-5" id="ratingLabel"></div>
            </div>
            <div>
              <label class="block font-medium mb-1">Comments <span class="text-red-500">*</span></label>
              <textarea class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-indigo-500" name="comments"
                id="feedbackComments" rows="4" required></textarea>
            </div>
            <button type="submit" id="submitFeedbackBtn"
              class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 font-bold transition">
              Submit Feedback
            </button>
          </form>
        </section>

      </div> <!-- End Survey Container -->


      <!-- ================= MENU & ORDER FLOW ================= -->
      <div id="menuContainer" class="hidden">

        <section id="menuDisplaySection">
          <div id="menuContent" class="space-y-8">
            <!-- Menu Sections rendered here -->
          </div>
          <div id="emptyMenuMsg" class="hidden text-center py-10 text-gray-500 italic">
            No menu items available right now.
          </div>
        </section>

        <!-- Cart Summary / Bottom Bar -->
        <div id="cartBar"
          class="fixed bottom-0 left-0 right-0 bg-white shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] p-4 hidden border-t border-gray-200 z-40">
          <div class="max-w-xl mx-auto flex justify-between items-center">
            <div>
              <p class="text-gray-600 text-sm"><span id="cartCount">0</span> Items</p>
              <p class="text-xl font-bold text-green-600" id="cartTotal">$0.00</p>
            </div>
            <button id="checkoutBtn"
              class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-indigo-700">
              Place Order
            </button>
          </div>
        </div>

      </div> <!-- End Menu Container -->


      <!-- ================= THANK YOU / SUCCESS ================= -->
      <section id="thankYouSection" class="hidden text-center py-12">
        <div class="bg-green-100 p-4 rounded-full inline-block mb-4">
          <span class="material-icons text-4xl text-green-600">check_circle</span>
        </div>
        <h2 class="text-2xl font-bold text-gray-800 mb-2">Success!</h2>
        <p class="text-gray-600 mb-8" id="successMessage">Your submission has been received.</p>
        <button id="homeBtn" class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700">
          Back to Home
        </button>
      </section>

      <!-- ================= CHECKOUT MODAL ================= -->
      <div id="checkoutModal"
        class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-sm w-full p-6">
          <h3 class="text-xl font-bold mb-4">Confirm Order</h3>
          <p class="text-sm text-gray-600 mb-4">Please enter your table number to complete the order.</p>

          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Table Number</label>
            <input type="number" id="tableNumberInput"
              class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none"
              placeholder="e.g. 5">
          </div>

          <div class="flex justify-end gap-3">
            <button id="cancelCheckoutBtn" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg">Cancel</button>
            <button id="confirmOrderBtn"
              class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 font-bold">Confirm</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- ================= FIREBASE & APP LOGIC ================= -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
      getFirestore,
      collection,
      getDocs,
      addDoc,
      query,
      where,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Firebase Config - Hardcoded for Web
    const firebaseConfig = {
      apiKey: 'AIzaSyCLHJ6TQKyxKVr6P3PkptvIuH1xQxmHNjY',
      appId: '1:205492068242:web:04e1bd80de8974aa4eeb4b',
      messagingSenderId: '205492068242',
      projectId: 'feedy-cebf6',
      authDomain: 'feedy-cebf6.firebaseapp.com',
      storageBucket: 'feedy-cebf6.firebasestorage.app',
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- State ---
    let ownerId = null;
    let activeSurveyId = null;
    let activeSurveyData = null;
    let cart = {}; // { dishId: { name, price, qty } }

    // --- DOM Elements ---
    const els = {
      loading: document.getElementById('loadingSection'),
      error: document.getElementById('errorSection'),
      errorMsg: document.getElementById('errorMessage'),
      surveyContainer: document.getElementById('surveyContainer'),
      surveySection: document.getElementById('surveySection'),
      feedbackSection: document.getElementById('feedbackSection'),
      menuContainer: document.getElementById('menuContainer'),
      thankYou: document.getElementById('thankYouSection'),

      navSurvey: document.getElementById('navSurveyBtn'),
      navMenu: document.getElementById('navMenuBtn'),

      menuContent: document.getElementById('menuContent'),
      cartBar: document.getElementById('cartBar'),
      cartCount: document.getElementById('cartCount'),
      cartTotal: document.getElementById('cartTotal'),

      checkoutModal: document.getElementById('checkoutModal'),
      tableInput: document.getElementById('tableNumberInput'),

      successMsg: document.getElementById('successMessage')
    };

    // --- Initialization ---
    async function init() {
      // Get UID from URL
      const urlParams = new URLSearchParams(window.location.search);
      ownerId = urlParams.get('uid');

      if (!ownerId) {
        showError('No business ID provided. Please scan a valid QR code.');
        return;
      }

      setupNavigation();
      setupForms();

      // Load initial data
      await loadSurvey();
      await loadMenu();

      els.loading.classList.add('hidden');

      // Default view
      showSurveyView();
    }

    // --- Navigation ---
    function setupNavigation() {
      els.navSurvey.addEventListener('click', showSurveyView);
      els.navMenu.addEventListener('click', showMenuView);

      document.getElementById('homeBtn').addEventListener('click', () => {
        window.location.reload();
      });

      document.getElementById('retryBtn').addEventListener('click', () => {
        window.location.reload();
      });
    }

    function showSurveyView() {
      els.surveyContainer.classList.remove('hidden');
      els.menuContainer.classList.add('hidden');
      els.thankYou.classList.add('hidden');

      els.navSurvey.classList.add('underline');
      els.navSurvey.classList.remove('opacity-70');
      els.navMenu.classList.remove('underline');
      els.navMenu.classList.add('opacity-70');
    }

    function showMenuView() {
      els.surveyContainer.classList.add('hidden');
      els.menuContainer.classList.remove('hidden');
      els.thankYou.classList.add('hidden');

      els.navMenu.classList.add('underline');
      els.navMenu.classList.remove('opacity-70');
      els.navSurvey.classList.remove('underline');
      els.navSurvey.classList.add('opacity-70');
    }

    function showError(msg) {
      els.loading.classList.add('hidden');
      els.errorMsg.textContent = msg;
      els.error.classList.remove('hidden');
    }

    // --- Survey Logic ---
    async function loadSurvey() {
      try {
        const q = query(
          collection(db, 'surveys'),
          where('creatorId', '==', ownerId),
          where('isActive', '==', true)
        );
        const snapshot = await getDocs(q);

        if (!snapshot.empty) {
          // Use the first active survey
          const doc = snapshot.docs[0];
          activeSurveyId = doc.id;
          activeSurveyData = doc.data();
          renderSurvey(activeSurveyData);
        } else {
          // No active survey, just show feedback form directly? 
          // Or hide survey section
          els.surveySection.classList.add('hidden');
          els.feedbackSection.classList.remove('hidden');
        }
      } catch (e) {
        console.error('Survey Load Error:', e);
        // Fallback to feedback only if survey fails
        els.surveySection.classList.add('hidden');
        els.feedbackSection.classList.remove('hidden');
      }
    }

    function renderSurvey(data) {
      els.surveySection.classList.remove('hidden');
      document.getElementById('surveyTitle').textContent = data.title || 'Survey';

      const container = document.getElementById('questionsContainer');
      container.innerHTML = '';

      if (!data.questions) return;

      Object.entries(data.questions).forEach(([qid, qData]) => {
        if (!qData || (typeof qData === 'object' && qData.value === false) || qData === false) return;

        const q = typeof qData === 'object' ? qData : { text: qid, type: 'text' };
        const wrapper = document.createElement('div');
        wrapper.className = 'space-y-2';

        const label = document.createElement('label');
        label.className = 'block font-bold text-gray-700';
        label.textContent = q.text || q.question || qid;
        wrapper.appendChild(label);

        // Input based on type
        let input;
        const type = q.type || 'text';

        if (type === 'rating') {
          input = document.createElement('div');
          input.className = 'flex gap-2';
          for (let i = 1; i <= 5; i++) {
            const lbl = document.createElement('label');
            lbl.className = 'cursor-pointer p-2 border rounded hover:bg-gray-50';
            lbl.innerHTML = `<input type="radio" name="${qid}" value="${i}" class="mr-2">${i} ⭐`;
            input.appendChild(lbl);
          }
        }
        else if (type === 'singleChoice' && q.options) {
          input = document.createElement('div');
          input.className = 'space-y-2';
          q.options.forEach(opt => {
            const lbl = document.createElement('label');
            lbl.className = 'flex items-center space-x-2 cursor-pointer';
            lbl.innerHTML = `<input type="radio" name="${qid}" value="${opt}"> <span>${opt}</span>`;
            input.appendChild(lbl);
          });
        }
        else {
          input = document.createElement('textarea');
          input.name = qid;
          input.className = 'w-full border rounded-lg p-2 focus:ring-2 focus:ring-indigo-500';
          input.rows = 3;
        }

        wrapper.appendChild(input);
        container.appendChild(wrapper);
      });
    }

    // --- Feedback Logic ---
    function setupForms() {
      // Star Rating Interaction
      const starContainer = document.getElementById('starRatingContainer');
      const ratingInput = document.getElementById('feedbackRating');
      const ratingLabel = document.getElementById('ratingLabel');

      const labels = ['Very Bad', 'Bad', 'Okay', 'Good', 'Excellent'];

      for (let i = 1; i <= 5; i++) {
        const star = document.createElement('button');
        star.type = 'button';
        star.className = 'text-3xl text-gray-300 focus:outline-none transition-colors transform hover:scale-110';
        star.innerHTML = '★';
        star.onclick = () => {
          ratingInput.value = i;
          ratingLabel.textContent = labels[i - 1];
          updateStars(i);
        };
        starContainer.appendChild(star);
      }

      function updateStars(val) {
        Array.from(starContainer.children).forEach((btn, idx) => {
          btn.classList.toggle('text-yellow-400', idx < val);
          btn.classList.toggle('text-gray-300', idx >= val);
        });
      }

      // Submit Handlers
      document.getElementById('surveyForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitSurveyBtn');
        btn.disabled = true;
        btn.innerText = 'Submitting...';

        try {
          const formData = new FormData(e.target);
          const data = Object.fromEntries(formData.entries());

          await addDoc(collection(db, 'survey_responses'), {
            ...data,
            owner_id: ownerId,
            survey_id: activeSurveyId,
            submitted_at: serverTimestamp()
          });

          // Move to feedback
          els.surveySection.classList.add('hidden');
          els.feedbackSection.classList.remove('hidden');
        } catch (err) {
          console.error(err);
          alert('Submission failed. Please try again.');
          btn.disabled = false;
          btn.innerText = 'Submit Survey';
        }
      };

      document.getElementById('feedbackForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitFeedbackBtn');
        btn.disabled = true;
        btn.innerText = 'Sending...';

        try {
          const formData = new FormData(e.target);
          const data = Object.fromEntries(formData.entries());

          await addDoc(collection(db, 'feedback'), {
            ...data,
            rating: parseInt(data.rating),
            owner_id: ownerId,
            created_at: new Date().toISOString() // Use ISO string matching Flutter model
          });

          showSuccess('Thank you for your feedback!');
        } catch (err) {
          console.error(err);
          alert('Submission failed.');
          btn.disabled = false;
          btn.innerText = 'Submit Feedback';
        }
      };

      // Checkout Handlers
      document.getElementById('checkoutBtn').onclick = () => {
        document.getElementById('checkoutModal').classList.remove('hidden');
        document.getElementById('tableNumberInput').focus();
      };

      document.getElementById('cancelCheckoutBtn').onclick = () => {
        document.getElementById('checkoutModal').classList.add('hidden');
      };

      document.getElementById('confirmOrderBtn').onclick = submitOrder;
    }


    // --- Menu & Order Logic ---
    async function loadMenu() {
      try {
        const q = query(collection(db, 'menu_sections'), where('ownerId', '==', ownerId), where('isActive', '==', true));
        const snapshot = await getDocs(q);

        els.menuContent.innerHTML = '';

        if (snapshot.empty) {
          document.getElementById('emptyMenuMsg').classList.remove('hidden');
          return;
        }

        snapshot.forEach(doc => {
          const section = doc.data();
          renderMenuSection(section);
        });

      } catch (e) {
        console.error('Menu Load Error:', e);
      }
    }

    function renderMenuSection(section) {
      if (!section.dishes || section.dishes.length === 0) return;

      const sectionEl = document.createElement('div');
      sectionEl.className = 'border-b pb-6 last:border-0';

      const title = document.createElement('h3');
      title.className = 'text-xl font-bold text-gray-800 mb-4';
      title.textContent = section.title;
      sectionEl.appendChild(title);

      const list = document.createElement('div');
      list.className = 'space-y-4';

      // Handle dishes list
      section.dishes.forEach(dish => {
        if (!dish.isAvailable) return;

        const itemEl = document.createElement('div');
        itemEl.className = 'flex justify-between items-start';

        itemEl.innerHTML = `
          <div class="flex-1">
            <h4 class="font-bold text-gray-700">${dish.name}</h4>
            <p class="text-sm text-gray-500 line-clamp-2">${dish.description || ''}</p>
            <p class="font-semibold text-green-600 mt-1">$${parseFloat(dish.price).toFixed(2)}</p>
          </div>
          <div class="ml-4" id="dish-controls-${dish.id}">
             <!-- Controls injected via JS -->
          </div>
        `;

        list.appendChild(itemEl);

        // Render controls immediately
        updateDishControls(dish, itemEl.querySelector(`[id^="dish-controls"]`));
      });

      sectionEl.appendChild(list);
      els.menuContent.appendChild(sectionEl);
    }

    function updateDishControls(dish, container) {
      const qty = cart[dish.id]?.qty || 0;

      container.innerHTML = '';

      if (qty === 0) {
        const addBtn = document.createElement('button');
        addBtn.className = 'bg-gray-100 text-indigo-600 px-3 py-1 rounded-lg text-sm font-bold hover:bg-gray-200';
        addBtn.textContent = 'Add';
        addBtn.onclick = () => updateCart(dish, 1);
        container.appendChild(addBtn);
      } else {
        const ctrlDiv = document.createElement('div');
        ctrlDiv.className = 'flex items-center bg-gray-100 rounded-lg';
        ctrlDiv.innerHTML = `
          <button class="px-2 py-1 text-indigo-600 font-bold hover:bg-gray-200" id="minus-${dish.id}">-</button>
          <span class="px-2 text-sm font-bold">${qty}</span>
          <button class="px-2 py-1 text-indigo-600 font-bold hover:bg-gray-200" id="plus-${dish.id}">+</button>
        `;
        container.appendChild(ctrlDiv);

        document.getElementById(`minus-${dish.id}`).onclick = () => updateCart(dish, qty - 1);
        document.getElementById(`plus-${dish.id}`).onclick = () => updateCart(dish, qty + 1);
      }
    }

    function updateCart(dish, newQty) {
      if (newQty <= 0) {
        delete cart[dish.id];
      } else {
        cart[dish.id] = {
          dishId: dish.id,
          name: dish.name,
          price: parseFloat(dish.price),
          qty: newQty
        };
      }

      // Update UI of the specific item without full rerender
      // Find containers for this dish (could be multiple if repeat sections? assume not)
      const ctrls = document.querySelectorAll(`#dish-controls-${dish.id}`);
      ctrls.forEach(c => updateDishControls(dish, c));

      renderCartBar();
    }

    function renderCartBar() {
      const items = Object.values(cart);
      const count = items.reduce((sum, item) => sum + item.qty, 0);
      const total = items.reduce((sum, item) => sum + (item.price * item.qty), 0);

      els.cartCount.textContent = count;
      els.cartTotal.textContent = '$' + total.toFixed(2);

      if (count > 0) {
        els.cartBar.classList.remove('hidden');
        els.menuContainer.style.paddingBottom = '80px'; // Space for bar
      } else {
        els.cartBar.classList.add('hidden');
        els.menuContainer.style.paddingBottom = '0';
      }
    }

    async function submitOrder() {
      const tableNum = els.tableInput.value.trim();
      if (!tableNum) {
        alert('Please enter your table number');
        return;
      }

      const items = Object.values(cart).map(i => ({
        dishId: i.dishId,
        name: i.name,
        price: i.price,
        quantity: i.qty,
        total: i.price * i.qty
      }));

      const totalAmount = items.reduce((sum, i) => sum + i.total, 0);

      const btn = document.getElementById('confirmOrderBtn');
      btn.disabled = true;
      btn.innerText = 'Ordering...';

      try {
        await addDoc(collection(db, 'orders'), {
          ownerId: ownerId,
          tableNumber: tableNum,
          items: items,
          totalAmount: totalAmount,
          status: 'pending',
          createdAt: serverTimestamp()
        });

        els.checkoutModal.classList.add('hidden');
        cart = {};
        renderCartBar();
        showSuccess(`Order placed for Table ${tableNum}!`);
      } catch (err) {
        console.error(err);
        alert('Order failed: ' + err.message);
        btn.disabled = false;
        btn.innerText = 'Confirm';
      }
    }

    function showSuccess(msg) {
      els.surveyContainer.classList.add('hidden');
      els.menuContainer.classList.add('hidden');
      els.thankYou.classList.remove('hidden');
      els.successMsg.textContent = msg;
    }

    // Start
    init();

  </script>
</body>

</html>
